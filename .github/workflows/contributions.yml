name: Validate contribution
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions: {}

jobs:
  validate:
    if: ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted validators from base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out contribution as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the Wignet validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fablamenas/wignet
          ref: ee041da7c7decd91657d86d07639a7846dbb4e0f
          path: wignet
          persist-credentials: false
      - name: Install trusted dependencies
        run: |
          python -m pip install -r wignet/deploy/requirements.lock
          cp wignet/backoffice/db.py.example wignet/backoffice/db.py
      - name: Validate proposed entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: ${{ github.workspace }}/wignet
        run: |
          git -C proposed fetch https://github.com/wignet/commons.git "$BASE_SHA"
          python trusted/check_changes.py proposed "$BASE_SHA" "$HEAD_SHA"

  merge:
    needs: validate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable automatic merge for the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(gh pr view "$PR_URL" --json baseRefName --jq .baseRefName)" = main
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
