name: Test validator changes
on:
  pull_request:
    paths:
      - 'validate_entry.py'
      - 'sprite_validation.py'
      - 'check_changes.py'
      - 'test_validate_entry.py'
      - 'fixtures/**'
      - '.github/workflows/validator-tests.yml'

permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python -m unittest -v test_validate_entry
